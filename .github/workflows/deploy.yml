name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Build
        # Ohne eigene Domain liegt die App unter /<repo>/ -- deshalb der Basis-Pfad.
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Öffentlicher Web-API-Key für die anonyme Anmeldung der Online-Lobby
          # (kein Geheimnis). Repository → Settings → Variables → FIREBASE_API_KEY.
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          # Schaltet Pages beim ersten Lauf selbst auf "GitHub Actions" um.
          # Ohne das schlaegt der Deploy fehl, solange niemand die Einstellung
          # unter Settings -> Pages von Hand gesetzt hat.
          enablement: true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
